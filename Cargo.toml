[package]
name = "AutoEngine"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "client"]

[lib]
name = "autoengine"
path = "src/lib.rs"

[[bin]]
name = "autoengine"
path = "src/main.rs"

[[bin]]
name = "autoengine-server"
path = "src/bin/server.rs"

[dependencies]
ron = "0.12.3"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
